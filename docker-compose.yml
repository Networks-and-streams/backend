services:
  db:
    image: postgres:15
    restart: always
    container_name: graph_db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    container_name: graph_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  stripe-cli:
    image: stripe/stripe-cli:v1.23.0
    container_name: graph_stripe_cli
    restart: unless-stopped
    env_file:
      - .env
    command: >
      listen
      --forward-to host.docker.internal:${PORT:-3001}/payments/webhook
      --api-key ${STRIPE_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  redis-data:
